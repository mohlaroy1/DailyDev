{% extends "base.html" %}

{% block title %}Edit {{ session.title }} | DailyDev{% endblock %}

{% block content %}

<style>
    .edit-page {
        max-width: 760px;
        margin: 0 auto;
    }

    .edit-header {
        margin-bottom: 24px;
    }

    .edit-header h1 {
        margin-bottom: 8px;
    }

    .edit-header p {
        color: #666;
        margin: 0;
    }

    .edit-card {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .edit-card form p {
        margin-bottom: 20px;
    }

    .edit-card label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .edit-card input,
    .edit-card textarea,
    .edit-card select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .edit-card textarea {
        resize: vertical;
    }

    .edit-card input:focus,
    .edit-card textarea:focus,
    .edit-card select:focus {
        outline: none;
        border-color: #333;
    }

    .helptext {
        display: block;
        margin-top: 6px;
        color: #777;
        font-size: 13px;
    }

    .errorlist {
        color: #c0392b;
        margin: 6px 0;
        padding-left: 20px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
    }

    .save-button,
    .cancel-button {
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
    }

    .save-button {
        border: none;
        background: #111;
        color: white;
    }

    .cancel-button {
        background: #f2f2f2;
        color: #333;
    }

    .save-button:hover {
        opacity: 0.85;
    }

    .cancel-button:hover {
        background: #e5e5e5;
    }
</style>

<div class="edit-page">

    <div class="edit-header">
        <h1>Edit Coding Session</h1>
        <p>Update your coding session details.</p>
    </div>

    <div class="edit-card">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="save-button">
                    Save Changes
                </button>

                <a
                    href="{% url 'session_detail' session.id %}"
                    class="cancel-button"
                >
                    Cancel
                </a>
            </div>
        </form>

    </div>

</div>

{% endblock %}
